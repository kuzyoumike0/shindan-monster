let answers=[],step=0,current=-1,sharedSums=null,sharedFeelings=null;const origin=location.origin;const app=document.querySelector('#app');function spriteFor(i){return '/assets/characters/monster-'+i+'.png'}
function art(i){return `<img class="monster-art" src="${spriteFor(i)}" alt="${monsters[i].name}のゴスロリ風キャラクター" width="512" height="512" decoding="async">`}



function compatibility(i){return {good:i^8,different:i^7}}
function compatibilityCards(i){const c=compatibility(i),self=monsters[i],good=monsters[c.good],other=monsters[c.different];const talks=(i&4)!==0,together=(i&2)!==0,free=(i&1)!==0;const mismatch=talks?'あなたは話しながら気持ちを確かめたい一方、この子は一度自分の中で整理したいタイプ。返事の速さで、気持ちの大きさを判断しないことが大切です。':'あなたは気持ちを整理してから伝えたい一方、この子は話しながら考えたいタイプ。沈黙を大切にする時間と、おしゃべりの時間を分けると安心できます。';const tip=together?'一緒に過ごす約束と、一人で休む時間を両方つくってみて。':'一人で休む時間がほしいときは、次に話せるタイミングも伝えてみて。';return `<section class="compatibility"><div class="eyebrow">YOUR MONSTER RELATIONSHIPS</div><h3>この子と、どんな関係になれる？</h3><p class="compatintro">${self.name}の、心地よい相手と違うリズムの相手。</p><div class="compatgrid"><article class="compatcard good"><span class="compatbadge">♡ 相性が合う相手</span><div class="compatportrait">${art(c.good)}</div><h4>${good.name}</h4><p class="compatlead">似ているペースで、自然体になれる。</p><p>気持ちの伝え方や、心地よい距離感が似ている二人。${free?'そのときの気分やひらめき':'先の見通しや小さな約束'}も大切にできるので、無理に合わせず過ごしやすい組み合わせです。</p><div class="compathint"><b>仲よく過ごすヒント</b>似ているからこそ「同じはず」と決めつけず、お互いの希望をひと言ずつ確かめて。</div><button class="profilebtn" data-compat="${c.good}">この子を詳しく見る →</button></article><article class="compatcard different"><span class="compatbadge">◇ すれ違いやすい相手</span><div class="compatportrait">${art(c.different)}</div><h4>${other.name}</h4><p class="compatlead">違うペースを、言葉でつないでいく。</p><p>${mismatch}</p><div class="compathint"><b>仲よく過ごすヒント</b>${tip}</div><button class="profilebtn" data-compat="${c.different}">この子を詳しく見る →</button></article></div><p class="compatnote">診断の4つの傾向をもとにした、物語としての相性です。すれ違いやすい相手とも、話し合いや気遣いで心地よい関係をつくれます。</p></section>`}
function bindCompatibility(){document.querySelectorAll('[data-compat]').forEach(b=>b.onclick=()=>profile(Number(b.dataset.compat)))}


const feelingNames=['嫉妬しやすさ','寂しさへの敏感さ','認めてほしい気持ち','考え込みやすさ'];
const feelingTips=['比べてしまったときは、相手を責める前に「自分も一緒に過ごしたかった」と、自分の望みを確かめてみて。','返信を待つ時間と、自分のために過ごす時間を分けてみて。寂しい気持ちは、責める言葉ではなくお願いとして伝えられます。','誰かの評価を待つ前に、自分が工夫したことを一つ書き留めてみて。認めてほしい気持ちも、自分の頑張りも大切にしていいのです。','分かっている事実と、まだ確かめていない想像を分けてみて。考える時間を区切り、必要なら相手に短く確かめても大丈夫です。'];
function effectiveFeelings(){return answers.length===24?feelingScores(answers):sharedFeelings}
function feelingPanel(){let f=effectiveFeelings();if(!f)return '<div class="axisnotes">この共有結果には、感情に関する追加質問の回答が含まれていません。今の気持ちを知りたいときは、もう一度診断してみてください。</div>';let top=f.indexOf(Math.max(...f));return `<section class="percentages feelings"><div class="eyebrow">THE FEELINGS YOUR MONSTER HOLDS</div><h3>怪物が抱えている、ちいさな気持ち</h3><p>嫉妬も、寂しさも、誰かを大切に思う心の一部。今の自分を知るために、そっと見てみましょう。</p>${f.map((v,j)=>`<div class="axis"><div class="axislabels"><span>${feelingNames[j]}</span><b>${Math.round(v/6*100)}%</b></div><div class="axisbar" role="img" aria-label="${feelingNames[j]} ${Math.round(v/6*100)}パーセント"><span style="width:${v/6*100}%"></span></div></div>`).join('')}<div class="compathint"><b>${Math.max(...f)===0?'今日の小さなヒント':feelingNames[top]+'が気になったときは'}</b>${Math.max(...f)===0?'今回の場面では、気持ちが揺れにくい回答が選ばれていました。別の日に違う気持ちになっても、それでよいのです。':feelingTips[top]}</div><p class="percentnote">各気持ちに関する2問の回答を0〜100%に換算した、この診断内の目安です。実際の感情の強さや、心理状態を測定するものではありません。</p></section>`}

function effectiveSums(){return answers.length===24?diagnose(answers).sums:(sharedSums||[2,2,2,2])}
function resultUrl(i){return origin+'/result/'+i+'/?s='+effectiveSums().join('-')+(effectiveFeelings()?'&f='+effectiveFeelings().join('-'):'')}
function percentPanel(){let sums=effectiveSums(),pairs=[['じっくり整理','話して整理'],['ひとり時間','一緒の時間'],['見通し重視','ひらめき重視'],['自分のペース','相手への気配り']];return `<section class="percentages"><h3>あなたの心のバランス</h3><p>前半16問から、4つの傾向を見てみると…</p>${pairs.map((pair,j)=>{let b=sums[j]*25,a=100-b;return `<div class="axis"><div class="axislabels"><span>${pair[0]} <b>${a}%</b></span><span><b>${b}%</b> ${pair[1]}</span></div><div class="axisbar" role="img" aria-label="${pair[0]} ${a}パーセント、${pair[1]} ${b}パーセント"><span style="width:${a}%"></span></div></div>`}).join('')}<p class="percentnote">各項目に関する4問の回答割合です。性格の強さや、怪物との一致率を測る数値ではありません。どちらが多くても、よい・悪いはありません。</p></section>`}
function openShared(){let match=location.pathname.match(/^\/result\/(0|[1-9]|1[0-5])\/?$/);if(!match)return false;let id=Number(match[1]),v=new URLSearchParams(location.search).get('s');if(!v||!/^([0-4]-){3}[0-4]$/.test(v)){profile(id);return true}let sums=v.split('-').map(Number);let bits=[(id>>2)&1,(id>>1)&1,id&1,(id>>3)&1];if(sums.some((x,j)=>x!==2&&Number(x>2)!==bits[j])){profile(id);return true}sharedSums=sums;let f=new URLSearchParams(location.search).get('f');sharedFeelings=f&&/^([0-6]-){3}[0-6]$/.test(f)?f.split('-').map(Number):null;answers=[];result(id);return true}
function profile(i){let m=monsters[i];app.innerHTML=`<section class="result fade"><div class="eyebrow">MONSTER PROFILE / NO. ${String(i+1).padStart(2,'0')}</div><div class="portrait">${art(i)}</div><h2>${m.name}</h2><p class="subtitle">${m.tag}</p><p class="intro">${m.intro}</p><p class="story">${m.story}</p><div class="quote">「${m.line}」</div><div class="details"><div class="panel"><label>好物</label><h3>${m.food}</h3></div><div class="panel"><label>なつく相手</label><h3>${m.friend}</h3></div><div class="panel wide"><label>今日の小さなお世話</label><h3>${m.care}</h3></div></div>${compatibilityCards(i)}<button class="primary" id="profileStart">自分の怪物を診断する ♡</button><br><button class="collectionlink" id="profileBack">← 図鑑に戻る</button></section>`;bindCompatibility();document.querySelector('#profileStart').onclick=()=>{answers=[];sharedSums=null;sharedFeelings=null;step=0;quiz()};document.querySelector('#profileBack').onclick=collection;scrollTo(0,0)}

function home(){if(location.pathname!=='/')history.replaceState(null,'','/');current=-1;app.innerHTML=`<section class="hero fade"><div class="copy"><span class="tag">あなたの気持ちに、名前をつけよう。</span><h1>あなたの心に住む、<br><em>ちいさな怪物</em></h1><p class="lead serif">言えなかった気持ちも、<br>ちょっと不器用なところも。<br>ぜんぶ抱えた、小さな味方。</p><p>24の質問に答えて、心の片隅にいる<br>あなただけの怪物に会いにいきませんか。</p><button class="primary" id="start">心の扉を、そっと開ける <span>♡</span></button><div class="note">全24問・約6分 ／ 登録不要<br>今のあなたに近いものを、気軽に選んでください。</div></div><div class="shelf">${[0,2,3,7].map(i=>`<div class="dollframe">${art(i)}<div class="caption">${monsters[i].name}</div></div>`).join('')}</div></section><div class="promise"><span><strong>24の小さな質問</strong> 日常の場面から選ぶ</span><span><strong>16人のやさしい怪物</strong> 今の気持ちを映す</span><span><strong>持ち帰れるカード</strong> 画像保存・シェア</span></div><button class="collectionlink" id="all">どんな怪物がいるの？　＋</button>`;document.querySelector('#start').onclick=()=>{answers=[];sharedSums=null;sharedFeelings=null;step=0;quiz()};document.querySelector('#all').onclick=collection;scrollTo(0,0)}
function quiz(){let q=questions[step];let transcript=questions.slice(0,step).map((item,j)=>`<div class="chatrow"><div class="avatar">${art(0)}</div><div class="bubble">${item.q}</div></div><div class="chatrow mine"><span class="read">既読</span><div class="bubble">${item.a[answers[j]]}</div></div>`).join('');app.innerHTML=`<section class="quiz chatquiz fade"><div class="chatheader"><span>‹</span><div>こころのトーク<small>だいじょうぶオバケとおはなし</small></div><span>♡</span></div><div class="progressline"><span>ふたりだけのおはなし</span><span>${step+1} / 24</span></div><div class="track"><div class="fill" style="width:${step/24*100}%"></div></div><div class="chatbody" id="chatbody"><div class="chatdate">きょう</div>${step===0?`<div class="chatrow"><div class="avatar">${art(0)}</div><div class="bubble">こんにちは。24の質問で、君の心に住む仲間を探すよ。今の気持ちに近いものを選んでね。</div></div>`:''}${transcript}<div class="chatrow" id="latest"><div class="avatar">${art(0)}</div><div class="bubble"><span class="chatq">QUESTION ${step+1}</span>${q.q}</div></div></div><div class="replyarea"><p>今の気持ちに近い返事を選んでね</p><div class="answers">${q.a.map((a,i)=>`<button class="answer ${answers[step]===i?'chosen':''}" data-choice="${i}"><b>${'ABCD'[i]}</b><span>${a}</span><small>送信 ›</small></button>`).join('')}</div><button class="back" id="back">← ${step?'ひとつ前の質問に戻る':'はじめのページに戻る'}</button><div class="note">診断のためのトーク演出です。LINEとの連携やメッセージの送信は行いません。</div></div></section>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.choice);if(step<23){step++;quiz()}else{current=diagnose(answers).id;result(current)};scrollTo(0,0)});document.querySelector('#back').onclick=()=>{if(step){step--;quiz()}else home()};let chat=document.querySelector('#chatbody');chat.scrollTop=chat.scrollHeight}

function result(i){current=i;history.replaceState(null,'',new URL(resultUrl(i)).pathname+new URL(resultUrl(i)).search);let m=monsters[i];app.innerHTML=`<section class="result fade" style="--accent:${m.color}"><div class="ribbon" aria-hidden="true">🎀</div><div class="eyebrow">YOUR LITTLE MONSTER / NO. ${String(i+1).padStart(2,'0')}</div><div class="portrait">${art(i)}</div><p class="note">今のあなたの心に住んでいるのは</p><h2>${m.name}</h2><p class="subtitle serif">${m.tag}</p><p class="intro">${m.intro}</p><p class="story">${m.story}</p><div class="quote">「${m.line}」</div><div class="details"><div class="panel"><label>FAVORITE / 好物</label><h3>${m.food}</h3></div><div class="panel"><label>A LITTLE TROUBLE / ちょっと苦手</label><h3>${m.trouble}</h3></div><div class="panel"><label>BEST COMPANY / なつく相手</label><h3>${m.friend}</h3></div><div class="panel"><label>TREASURE / いつも持っているもの</label><h3>${m.charm}</h3></div><div class="panel wide"><label>A LITTLE CARE / 今日の小さなお世話</label><h3>${m.care}</h3></div></div>${feelingPanel()}${percentPanel()}${compatibilityCards(i)}<div class="axisnotes">${summary()}<br>今回の回答から選ばれた、今のあなたに近い物語です。気分や過ごし方が変われば、別の怪物に出会うこともあります。</div><div class="actions"><button class="primary" id="save">この子のカードを保存 <span>↓</span></button><button class="secondary" id="share">画像付きで結果をポスト</button><button class="secondary" id="copy">結果をコピー</button></div><div class="status" role="status" id="status"></div><button class="collectionlink" id="retry">もう一度、会いにいく　↻</button>　<button class="collectionlink" id="all">怪物たちの図鑑　＋</button></section>`;bindCompatibility();document.querySelector('#save').onclick=()=>save(i);document.querySelector('#copy').onclick=()=>copy(i);document.querySelector('#share').onclick=()=>share(i);document.querySelector('#retry').onclick=()=>{answers=[];sharedSums=null;sharedFeelings=null;step=0;quiz()};document.querySelector('#all').onclick=collection;scrollTo(0,0)}
function summary(){let d=answers.length===24?diagnose(answers):{bits:[(current>>2)&1,(current>>1)&1,current&1,(current>>3)&1]};return '今回のあなた：'+[d.bits[0]?'話しながら気持ちを確かめる':'気持ちを整理してから伝える',d.bits[1]?'気の合う人と過ごすと落ち着く':'一人の時間が心地よい',d.bits[2]?'そのときの気分や発想を大切にする':'見通しがあると安心する',d.bits[3]?'相手の希望から考える':'自分の希望から考える'].join(' ／ ')}
function collection(){app.innerHTML=`<section class="collection fade"><div class="eyebrow">THE LITTLE MONSTER BOOK</div><h2>どの子も、誰かの小さな味方。</h2><p>心の片隅で暮らす、16人の怪物たち。<br>気になる子はいますか？</p><div class="grid">${monsters.map((m,i)=>`<article class="card">${art(i)}<div class="no">NO. ${String(i+1).padStart(2,'0')}</div><h3>${m.name}</h3><p>${m.tag}</p><button class="profilebtn" data-profile="${i}">この子をもっと知る →</button></article>`).join('')}</div><button class="collectionlink" id="return">← ${current>=0?'自分の怪物に戻る':'はじめのページに戻る'}</button></section>`;document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>profile(Number(b.dataset.profile)));document.querySelector('#return').onclick=()=>current>=0?result(current):home();scrollTo(0,0)}
function msg(s){document.querySelector('#status').textContent=s}function factorLines(){const sums=effectiveSums(),pairs=[['じっくり整理','話して整理'],['ひとり時間','一緒の時間'],['見通し重視','ひらめき重視'],['自分のペース','相手への気配り']];return pairs.map((p,j)=>p[Number(sums[j]>2)]+' '+Math.max(sums[j]*25,100-sums[j]*25)+'%')}
function text(i){return `私の心の怪物は「${monsters[i].name}」♡\n${(effectiveFeelings()?effectiveFeelings().map((v,j)=>feelingNames[j]+' '+Math.round(v/6*100)+'%'):factorLines()).join(' ／ ')}\n#あなたの心に住むちいさな怪物`}

async function copy(i){try{await navigator.clipboard.writeText(text(i)+'\n'+resultUrl(i));msg('結果をコピーしました。')}catch{msg('コピーできませんでした。カードの画像保存をお試しください。')}}
function downloadCard(blob,i){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='little-monster-'+(i+1)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function save(i){try{let blob=await makeCard(i);if(!blob)return;downloadCard(blob,i);msg('怪物のカードを保存しました。')}catch{msg('画像を保存できませんでした。もう一度お試しください。')}}
async function share(i){
const launch=document.querySelector('#share');launch.disabled=true;launch.textContent='画像を準備しています…';
try{let blob=await makeCard(i);if(!blob)return;const file=new File([blob],'little-monster-'+(i+1)+'.png',{type:'image/png'}),url=URL.createObjectURL(blob);let dialog=document.createElement('dialog');dialog.className='share-dialog';dialog.setAttribute('aria-labelledby','shareTitle');dialog.innerHTML=`<button class="share-close" aria-label="閉じる">×</button><h2 id="shareTitle">画像と一緒に、結果をポスト ♡</h2><p>キャラと診断の割合が入った、あなたの結果カードです。</p><img class="share-preview" src="${url}" alt="${monsters[i].name}の診断結果カード"><div class="share-buttons"><button class="primary" id="shareNative">画像付きで共有する ↗</button><button class="secondary" id="shareDownload">結果画像を保存 ↓</button><button class="secondary" id="shareImageCopy">画像をコピー</button><a class="primary share-x" href="https://twitter.com/intent/tweet?${new URLSearchParams({text:text(i),url:resultUrl(i)})}" target="_blank" rel="noopener noreferrer">Xの投稿画面を開く ↗</a></div><p class="share-help" id="shareHelp">PCでは画像を保存し、Xの投稿画面の画像ボタンから添付してください。画像をコピーできる環境では、投稿欄に貼り付けることもできます。</p><p class="share-feedback" role="status" id="shareFeedback"></p>`;document.body.append(dialog);let supported=Boolean(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}));dialog.querySelector('#shareNative').hidden=!supported;if(supported)dialog.querySelector('#shareHelp').textContent='「画像付きで共有する」から共有先にXを選んでください。画像が引き継がれない場合は、保存して添付してください。';dialog.querySelector('.share-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{URL.revokeObjectURL(url);dialog.remove();launch.focus()},{once:true});dialog.querySelector('#shareDownload').onclick=()=>{downloadCard(blob,i);dialog.querySelector('#shareFeedback').textContent='画像を保存しました。Xの投稿画面で、この画像を添付してください。'};dialog.querySelector('#shareImageCopy').onclick=async()=>{try{if(!navigator.clipboard?.write||typeof ClipboardItem==='undefined')throw Error();await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);dialog.querySelector('#shareFeedback').textContent='画像をコピーしました。Xの投稿欄に貼り付けてください。'}catch{dialog.querySelector('#shareFeedback').textContent='この環境では画像をコピーできません。画像を保存して添付してください。'}};dialog.querySelector('#shareNative').onclick=async()=>{try{await navigator.share({title:'あなたの心に住む、ちいさな怪物',text:text(i)+'\n'+resultUrl(i),files:[file]});dialog.querySelector('#shareFeedback').textContent='共有先で画像と文章を確認し、投稿してください。'}catch(e){if(e.name!=='AbortError')dialog.querySelector('#shareFeedback').textContent='画像を共有できませんでした。保存してXに添付してください。'}};dialog.showModal();
}catch{msg('投稿用の画像を作れませんでした。もう一度お試しください。')}finally{launch.disabled=false;launch.textContent='画像付きで結果をポスト'}
}


function wrap(ctx,s,x,y,w,line){let row='';for(let ch of s){if(ctx.measureText(row+ch).width>w){ctx.fillText(row,x,y);row=ch;y+=line}else row+=ch}if(row)ctx.fillText(row,x,y);return y+line}
async function makeCard(i){let m=monsters[i],im=new Image();im.src=spriteFor(i);try{await im.decode()}catch{msg('画像を読み込めませんでした。もう一度お試しください。');return}let c=document.createElement('canvas');c.width=1080;c.height=1920;let x=c.getContext('2d');x.fillStyle='#f8edf4';x.fillRect(0,0,1080,1920);x.fillStyle='#fffafd';x.fillRect(48,48,984,1824);x.strokeStyle='#9a7791';x.lineWidth=2;x.strokeRect(48,48,984,1824);x.strokeRect(62,62,956,1796);x.textAlign='center';x.fillStyle='#a06185';x.font='25px Georgia,serif';x.fillText('♡  MY LITTLE MONSTER  ♡',540,125);x.drawImage(im,0,0,im.width,im.height,260,170,560,560);x.fillStyle='#8d6b82';x.font='23px sans-serif';x.fillText('あなたの心に住む、ちいさな怪物',540,790);x.fillStyle='#5c3a54';x.font='bold 52px serif';x.fillText(m.name,540,871);x.fillStyle='#a36388';x.font='28px serif';wrap(x,m.tag,540,930,840,43);x.strokeStyle='#e1c9d9';x.beginPath();x.moveTo(130,1000);x.lineTo(950,1000);x.stroke();x.fillStyle='#76506a';x.font='33px serif';wrap(x,'「'+m.line+'」',540,1080,830,52);x.font='21px sans-serif';wrap(x,'好物：'+m.food,540,1220,830,36);x.fillStyle='#ab809b';x.font='19px sans-serif';x.font='23px sans-serif';let sums=effectiveSums();factorLines().forEach((label,j)=>{x.fillStyle='#9d6486';x.fillText(label,540,1320+j*52)});let feels=effectiveFeelings();if(feels){x.font='22px sans-serif';feels.forEach((v,j)=>{x.fillStyle='#9d6486';x.fillText(feelingNames[j]+' '+Math.round(v/6*100)+'%',540,1560+j*49)})}x.fillStyle='#ab809b';x.font='19px sans-serif';x.fillText('#あなたの心に住むちいさな怪物',540,1840);return await new Promise((resolve,reject)=>c.toBlob(blob=>blob?resolve(blob):reject(new Error('画像を生成できませんでした。')),'image/png'))}
document.querySelector('#home').onclick=home;document.querySelector('#nav').onclick=collection;if(!openShared())home();
</script></body></html>
